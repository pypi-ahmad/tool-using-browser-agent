[project]
name = "tool-using-browser-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "ty>=0.0.71",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
